# Generic Tests
models:
  - name: stg_jaffle_shop__customers
    description: The grain on this table is one unique customer per row
    columns:
      - name: customer_id
        description: Primary key for the customers table
        data_tests:
          - unique
          - not_null
  - name: stg_jaffle_shop__orders
    description: one order per row
    columns:
      - name: order_id
        description: Primary key for the orders table
        data_tests:
          - unique
          - not_null
      - name: 
      # use markdown doc block for longer description
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments: 
                values: ['completed','shipped','placed','returned','return_pending']
      # checks that every customer id in the order has a customer in the customer model (relationship test)
      - name: customer_id
        data_tests:
          - relationships:
              arguments: 
                to: ref('stg_jaffle_shop__customers')
                field: customer_id